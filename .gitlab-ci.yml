stages:
  - build
  - test
  - push
  - deploy

build_job:
  stage: build
  script:
    - docker build -t springboot-bankapp .
  tags:
    - dev

test_job:
  stage: test
  script:
    - echo "Testing"
  tags:
    - dev

push_job:
  stage: push
  script:
    - docker login -u $DOCKERHUB_USER -p $DOCKERHUB_PASS
    - docker image tag springboot-bankapp $DOCKERHUB_USER/springboot-bankapp:latest
    - docker push $DOCKERHUB_USER/springboot-bankapp:latest
  tags:
    - dev

deploy_job:
  stage: deploy
  script:
    - docker-compose up -d
  tags:
    - dev
